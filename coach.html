<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a1a2e">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="manifest" href="coach-manifest.json">
<title>Fitness Coach v1.4</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f0f23;--card:#1a1a2e;--accent:#e94560;--green:#00e676;--yellow:#ffd600;--blue:#448aff;--text:#e0e0e0;--muted:#888;--border:#2a2a4a}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:70px}
.header{background:var(--card);padding:12px;text-align:center;border-bottom:1px solid var(--border)}
.header h1{font-size:16px}
.header .sync{font-size:10px;color:var(--green);margin-top:4px}
.container{max-width:600px;margin:0 auto;padding:10px}
.card{background:var(--card);border-radius:10px;padding:14px;margin-bottom:10px;border:1px solid var(--border)}
.card h2{font-size:13px;color:var(--accent);margin-bottom:10px}
.sr{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px}
.sr:last-child{border-bottom:none}
.sl{color:var(--muted)}.sv{font-weight:600}
.sg{color:var(--green)}.sw{color:var(--yellow)}.sb{color:var(--accent)}
.verdict{text-align:center;padding:14px 0}
.verdict .big{font-size:26px;font-weight:700;letter-spacing:1px}
.verdict .sub{font-size:12px;color:var(--muted);margin-top:6px}
.v-go{color:var(--green)}.v-modify{color:var(--yellow)}.v-skip{color:var(--accent)}
.rec{background:var(--card);border-radius:10px;padding:14px;margin-bottom:10px;border-left:4px solid var(--border)}
.rec-go{border-left-color:var(--green)}.rec-modify{border-left-color:var(--yellow)}.rec-skip{border-left-color:var(--accent)}
.rec h3{font-size:14px;margin-bottom:8px}
.rec p{font-size:13px;line-height:1.6;margin:4px 0}
.rec .hint{font-size:12px;color:var(--muted)}
.sig{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.sig:last-child{border-bottom:none}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.dot-g{background:var(--green)}.dot-a{background:var(--yellow)}.dot-r{background:var(--accent)}.dot-u{background:var(--muted)}
.sig .name{flex:1;color:var(--muted)}
.sig .val{font-weight:600}
.sig .delta{font-size:11px;color:var(--muted)}
.note{font-size:12px;color:var(--muted);line-height:1.6;margin:4px 0}
.loading{text-align:center;padding:20px;color:var(--muted);font-size:12px}
.err{color:var(--accent);text-align:center;padding:10px;font-size:12px}
.reload{display:block;margin:10px auto;padding:8px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:13px;cursor:pointer}
.alert{background:#e9456022;border:1px solid var(--accent);border-radius:8px;padding:10px;margin-bottom:10px;font-size:12px;color:var(--text)}
</style>
</head>
<body>
<div class="header">
<h1>🏋️ Fitness Coach</h1>
<div class="sync" id="sync">⏳ Lade...</div>
</div>
<div class="container">
<div class="card" id="verdictCard"><div class="loading">Werte latest.json aus...</div></div>
<div id="recBox"></div>
<div class="card"><h2>📅 Empfehlung für morgen</h2><div id="tmrw"><div class="loading">Lade...</div></div></div>
<div class="card"><h2>🗓️ Plan nächste 7–10 Tage</h2><div id="plan"><div class="loading">Lade...</div></div></div>
<div class="card"><h2>🎯 Zonen (HF / Watt)</h2><div id="zones"><div class="loading">Lade...</div></div></div>
<div class="card"><h2>❤️ VO2max verbessern</h2><div id="vo2"><div class="loading">Lade...</div></div></div>
<div class="card"><h2>📡 Vital-Signale</h2><div id="signals"><div class="loading">Lade...</div></div></div>
<div class="card"><h2>📝 Notizen</h2><div id="notes"><div class="loading">Lade...</div></div></div>
<div class="card"><h2>⚠️ Alerts</h2><div id="alerts"><div class="loading">Lade...</div></div></div>
</div>
<div class="nav" style="position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:8px 0;z-index:100">
<div style="text-align:center;padding:4px 10px;font-size:10px;color:var(--muted)" onclick="location.href='dashboard.html'"><div style="font-size:20px">📊</div>Dashboard</div>
<div style="text-align:center;padding:4px 10px;font-size:10px;color:var(--muted)" onclick="location.href='vo2.html'"><div style="font-size:20px">❤️</div>VO2max</div>
<div style="text-align:center;padding:4px 10px;border-radius:6px;font-size:10px;color:var(--text);background:var(--border)" onclick="load()"><div style="font-size:20px">🔄</div>Neu laden</div>
</div>
<script>
var GH_REPO="SurfaceDuoPhone/intervals-icu";
var GH_FILE="latest.json";

function fetchData(){
  var url="https://raw.githubusercontent.com/"+GH_REPO+"/main/"+GH_FILE+"?v="+Date.now();
  var controller=new AbortController();
  var timeout=setTimeout(function(){controller.abort();},20000);
  return fetch(url,{signal:controller.signal,cache:"no-store"})
    .then(function(r){clearTimeout(timeout);if(!r.ok)throw new Error("GitHub "+r.status);return r.json();})
    .catch(function(e){clearTimeout(timeout);throw e;});
}

function round1(x){return Math.round(x*10)/10;}
function round2(x){return Math.round(x*100)/100;}

function sigRow(name,value,delta,status){
  var dot=status==="green"?'dot-g':status==="amber"?'dot-a':status==="red"?'dot-r':'dot-u';
  var col=status==="green"?'sg':status==="amber"?'sw':status==="red"?'sb':'';
  return '<div class="sig"><span class="dot '+dot+'"></span><span class="name">'+name+'</span>'+
    (delta?'<span class="delta">'+delta+'</span>':'')+
    '<span class="val '+col+'">'+value+'</span></div>';
}

function dayLabel(d){
  return d.toLocaleDateString('de-DE',{weekday:'short'})+', '+d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'});
}
function planRow(date, icon, label, dur, zones, tss){
  return '<div class="sig"><span class="name" style="width:88px;flex:none">'+dayLabel(date)+'</span>'+
    '<span style="flex:1;font-size:13px">'+icon+' '+label+(dur?' · '+dur:'')+'</span>'+
    '<span class="delta">'+(zones||'')+'</span>'+
    (tss?'<span class="val">'+tss+' TSS</span>':'')+'</div>';
}

function buildTomorrow(rec, rd, dm, cm, f){
  var lines=[];
  var sig=rd.signals||{};
  var hrv=sig.hrv?{status:sig.hrv.status,delta:sig.hrv.delta_pct}:null;
  var rhr=sig.rhr?{status:sig.rhr.status,delta:sig.rhr.delta_bpm}:null;
  var sleepH=(sig.sleep?sig.sleep.hours:null)||cm.sleep_hours;
  var tsb=(f.tsb!==undefined&&f.tsb!==null)?f.tsb:null;
  var acwr=dm.acwr;

  // Start: adjust from today
  if(rec==="skip") lines.push('🚶 <b>Ganz locker</b> – 30 min Z1 oder kompletter Ruhetag. Nur wenn du dich ausgeruht fühlst.');
  else if(rec==="modify") lines.push('🚴 <b>Erholungsfahrt</b> – 45–60 min Z1–Z2, keine Tempowechsel.');
  else{
    if(tsb!==null&&tsb>10) lines.push('⚡ <b>Qualitätstag</b> – 60–75 min inkl. 3–4×3 min Z3 (Pause 3 min).');
    else lines.push('🏃 <b>Ausdauer</b> – 60–75 min Z2. Ruhig beginnen, Puls im Auge behalten.');
  }
  // Modifiers
  if(sleepH!==null&&sleepH!==undefined&&sleepH<6.5) lines.push('😴 Wenig Schlaf ('+round1(sleepH)+' h) – Einheit kürzen oder auf den Nachmittag verschieben.');
  if(hrv&&hrv.status==="amber") lines.push('❤️ HRV noch unter Baseline – morgen VOR dem Training checken: bleibt der Wert tief, nur Z1 fahren.');
  if(hrv&&hrv.status==="red") lines.push('❤️ HRV deutlich unter Baseline – Ruhe bevorzugen.');
  if(rhr&&rhr.status==="red") lines.push('💓 Ruhepuls erhöht – auf Belastung verzichten.');
  if(acwr!==null&&acwr!==undefined&&acwr>=1.3) lines.push('📈 ACWR '+round2(acwr)+' – morgen nur leichte Aktivität.');
  return lines.map(function(l){return '<p>'+l+'</p>';}).join('');
}

function buildPlan(rec, rd, dm, cm, f, wk){
  var sig=rd.signals||{};
  var hrvStatus=(sig.hrv&&sig.hrv.status)||'green';
  var rhrStatus=(sig.rhr&&sig.rhr.status)||'green';
  var sleepH=(sig.sleep?sig.sleep.hours:null)||cm.sleep_hours;
  var tsb=(f.tsb!==undefined&&f.tsb!==null)?f.tsb:null;
  var acwr=dm.acwr;
  var ramp=(f.ramp_rate!==undefined&&f.ramp_rate!==null)?f.ramp_rate:null;

  // Template: array of {icon,label,dur,zones,tss}
  var base=[
    ['🚴','Erholung/Technik',null,'Z1'],
    ['⚡','Intervalle (5×3 min Z3)','75 min','Z3/Z1'],
    ['🚶','Lockere Einheit',null,'Z1'],
    ['🏃','Ausdauer','60–75 min','Z2'],
    ['🚴','Lange Ausdauer','90 min','Z1–Z2'],
    ['😴','Ruhetag',null,'–'],
    ['🏃','Ausdauer','60–75 min','Z2'],
    ['⚡','Tempo/Intervalle','60 min','Z3'],
    ['🚶','Ausgleich (Dehnen/Gehen)',null,'Z1'],
    ['😴','Ruhetag / sehr leicht',null,'–']
  ];

  var easyWeek = (tsb!==null&&tsb<-25) || hrvStatus==='red' || rhrStatus==='red';
  if(easyWeek){
    base=[
      ['🚶','Erholung','30–45 min','Z1'],
      ['😴','Ruhetag',null,'–'],
      ['🚴','Ganz locker','45 min','Z1'],
      ['🚶','Spazieren/Dehnen',null,'Z1'],
      ['🚴','Leichte Ausdauer','60 min','Z1'],
      ['😴','Ruhetag',null,'–'],
      ['🚶','Erholung','30–45 min','Z1'],
      ['😴','Ruhetag',null,'–'],
      ['🚴','Ganz locker','45 min','Z1'],
      ['🚶','Spazieren/Dehnen',null,'–']
    ];
  }else if(acwr!==null&&acwr!==undefined&&acwr>=1.3){
    base=[
      ['🚴','Erholung','45 min','Z1'],
      ['🏃','Ausdauer leicht','45–60 min','Z1–Z2'],
      ['🚶','Regeneration',null,'Z1'],
      ['🚴','Ausdauer','60 min','Z2'],
      ['😴','Ruhetag',null,'–'],
      ['🚶','Ganz locker','45 min','Z1'],
      ['🏃','Ausdauer leicht','60 min','Z1–Z2'],
      ['😴','Ruhetag',null,'–'],
      ['🚴','Leichte Ausdauer','60 min','Z1–Z2'],
      ['🚶','Spazieren/Dehnen',null,'–']
    ];
  }else if(acwr!==null&&acwr!==undefined&&acwr<0.8){
    base=[
      ['🏃','Ausdauer','60–75 min','Z2'],
      ['⚡','Intervalle (5×3 min Z3)','75 min','Z3/Z1'],
      ['🚶','Lockere Einheit',null,'Z1'],
      ['⚡','Tempoeinheit','60 min','Z3'],
      ['🚴','Lange Ausdauer','90 min','Z1–Z2'],
      ['😴','Ruhetag',null,'–'],
      ['🏃','Ausdauer','60–75 min','Z2'],
      ['⚡','Intervalle (4×4 min Z3)','75 min','Z3/Z1'],
      ['🚶','Ausgleich',null,'Z1'],
      ['🏃','Langer Lauf','90 min','Z1–Z2']
    ];
  }

  // Day 1 (tomorrow) override based on today's verdict
  var tomorrowLabel;
  if(rec==="skip") tomorrowLabel=['🚶','Ganz locker','30 min','Z1'];
  else if(rec==="modify") tomorrowLabel=['🚴','Erholungsfahrt','45–60 min','Z1–Z2'];
  else if(tsb!==null&&tsb>10) tomorrowLabel=['⚡','Qualitätstag','60–75 min','Z3/Z1'];
  else tomorrowLabel=['🏃','Ausdauer','60–75 min','Z2'];
  base[0]=tomorrowLabel;
  if(sleepH!==null&&sleepH!==undefined&&sleepH<6.5){
    base[0][1]=base[0][1]+' (verkürzt)';
  }

  var rows=[];
  var d=new Date(); d.setDate(d.getDate()+1);
  var totalTss=0;
  base.forEach(function(b,idx){
    var tssVal = b[3]==='Z1'?(idx%3===0?25:15):b[3]==='Z1–Z2'?(idx%2===0?45:35):b[3]==='Z2'?60:b[3]==='Z3'?90:0;
    if(b[2]==='–'||b[2]===null) tssVal=0;
    totalTss+=tssVal;
    rows.push(planRow(d,b[0],b[1],b[2],b[3],tssVal||null));
    d.setDate(d.getDate()+1);
  });

  var note=[];
  var lastWk=(wk&&wk.total_tss)?wk.total_tss:null;
  note.push('📊 Geschätzte Wochenbelastung: ca. '+totalTss+' TSS'+(lastWk?(' (bisherige Woche: ~'+lastWk+' TSS)'):'')+'.');
  if(ramp!==null) note.push((ramp>0?'📈':'📉')+' CTL-Trend: '+round1(ramp)+' pro Woche.');
  if(acwr!==null&&acwr!==undefined){
    if(acwr>=1.3) note.push('⚠️ ACWR '+round2(acwr)+' – Plan bewusst entlastend. Nach 2–3 Tagen neu bewerten.');
    else if(acwr<0.8) note.push('✅ ACWR '+round2(acwr)+' – Plan leicht aufbauend, um Belastung zu steigern.');
    else note.push('✅ ACWR '+round2(acwr)+' im optimalen Bereich.');
  }
  if(easyWeek) note.push('😴 Erholungswoche: HRV/Ruhepuls/TSB zeigen erhöhte Ermüdung. Ziel: Regeneration statt Leistung.');
  note.push('💡 Regeln: HRV morgens checken – bei >10 % unter Baseline Einheit kürzen. Bei Krankheit/Schlafmangel immer Ruhe wählen.');

  return rows.join('')+'<div class="note" style="margin-top:8px">'+note.join('<br>')+'</div>';
}

function buildVo2(rd, dm, cm, f, ap, th, zList){
  var vo2=(th&&th.vo2max)||(cm&&cm.vo2max)||null;
  if(vo2===null||vo2===undefined) return null;
  var z5=null;
  for(var zi=0;zi<(zList||[]).length;zi++){ if(zList[zi].zone==='Z5'){ z5=zList[zi]; break; } }
  var hr5=z5&&z5.hr_max!==null&&z5.hr_max!==undefined?(z5.hr_min+'–'+z5.hr_max+' bpm'):'~90–95 % HFmax';
  var w5=z5&&z5.power&&z5.power.w_max!==null&&z5.power.w_max!==undefined?(z5.power.w_min+'–'+z5.power.w_max+' W'):null;
  var sig=rd.signals||{};
  var hrv=sig.hrv&&sig.hrv.status;
  var rhr=sig.rhr&&sig.rhr.status;
  var sleepH=(sig.sleep&&sig.sleep.hours)||cm.sleep_hours;
  var acwr=dm.acwr;
  var tired=(hrv==='amber'||hrv==='red'||rhr==='red'||(acwr!==null&&acwr!==undefined&&acwr>=1.3));
  var tips=[];
  tips.push('⚡ <b>2× pro Woche VO2max-Intervalle:</b> Deine Standards 4×4 min und 5×5 min bei ~90–95 % HFmax (= deine Z5: '+hr5+') mit 3–4 min lockerer Pause. Beides funktioniert – 5×5 ist die anspruchsvollere Variante.');
  if(w5) tips.push('🚴 Am Rad: 5×3 min bei maximaler, gleichmäßiger Leistung (Z5 = '+w5+').');
  if(tired) tips.push('⚠️ <b>Heute/aktuell kein Intervall:</b> HRV bzw. Ruhepuls zeigen erhöhte Ermüdung. Erst wieder, wenn HRV über Baseline und Ruhepuls normal sind.');
  if(sleepH!==null&&sleepH!==undefined&&sleepH<7) tips.push('😴 Schlaf (aktuell '+round1(sleepH)+' h): Intervalle nur bei 7–8 h Schlaf – sonst bringt der Reiz deutlich weniger.');
  tips.push('📈 <b>Steigerung:</b> Intensität langsam erhöhen (+5–10 % pro Woche), nie zwei harte Tage hintereinander.');
  tips.push('🔁 <b>Konsistenz:</b> 12+ Wochen dranbleiben – realistisch sind +3–10 % des aktuellen Werts.');
  tips.push('🧘 <b>Erholung zählt:</b> Dein hoher Easy-Anteil (~80 % Z1/Z2) ist die ideale Basis; die Qualität kommt oben drauf.');
  if(ap&&ap.age) tips.push('💡 Mit '+ap.age+' Jahren: 5×5 nur bei guter Erholung – sonst lieber 4×4 wählen und volle Pausen nehmen. Regeneration wird wichtiger.');
  var rating=vo2>=45?'Für dein Alter ein überdurchschnittlicher Wert – so hältst du ihn oben:':'Solider Wert – so verbesserst du ihn:';
  return '<div class="sig"><span class="name">Aktueller VO2max</span><span class="val sg">'+round1(vo2)+' ml/kg/min</span></div>'+
    '<div class="note">'+rating+'</div>'+
    tips.map(function(t){return '<p>'+t+'</p>';}).join('');
}

function render(D){
  var rpt=D||{};
  var rd=rpt.readiness_decision||{};
  var dm=rpt.derived_metrics||{};
  var cm=(rpt.current_status||{}).current_metrics||{};
  var f=(rpt.current_status||{}).fitness||{};
  var ap=rpt.athlete_profile||{};
  var sig=rd.signals||{};
  var rec=rd.recommendation||"go";
  var reason=rd.reason||"";
  var adj=((rd.modification||{}).suggested_adjustments)||{};
  var intensity=adj.intensity||"preserve";
  var volume=adj.volume||"preserve";
  var capZone=adj.cap_zone||null;

  // ==== Verdict ====
  var verdictEl=document.getElementById('verdictCard');
  var vBig,vClass,vSub;
  if(rec==="go"){vBig="Volle Belastung";vClass="v-go";vSub="Grünes Licht – Training wie geplant möglich.";}
  else if(rec==="skip"){vBig="Erholungstag";vClass="v-skip";vSub="Regeneration hat Priorität – heute keine Belastung.";}
  else{vBig="Training anpassen";vClass="v-modify";vSub="Bereit, aber mit Reduzierung trainieren.";}
  var p=rd.priority||"";
  verdictEl.innerHTML='<div class="verdict"><div class="big '+vClass+'">'+vBig+'</div>'+
    '<div class="sub">'+vSub+(p?' · Priorität P'+p:'')+'</div></div>'+
    (reason?'<div class="note" style="text-align:center">'+reason+'</div>':'');

  // ==== Recommendation ====
  var recBox=document.getElementById('recBox');
  var lines=[];
  var cls=rec==="go"?'rec-go':rec==="skip"?'rec-skip':'rec-modify';

  // Concrete session suggestion
  var hrvD=null;if(sig.hrv&&sig.hrv.baseline_7d)hrvD=((sig.hrv.value-sig.hrv.baseline_7d)/sig.hrv.baseline_7d*100);
  var sleepH=sig.sleep?sig.sleep.hours:(cm.sleep_hours||null);
  var tsb=f.tsb;
  var acwr=dm.acwr;

  if(rec==="go"){
    if(tsb===null||tsb===undefined) lines.push('🏃 <b>Ausdauer-Einheit Z2</b> (60–90 min). Solide Grundlage aufbauen.');
    else if(tsb>10) lines.push('⚡ <b>Qualitätstag:</b> Intervalle möglich (z. B. 4×4 min Z3/Z4 mit 3 min Pause) oder 60–90 min mit Tempowechseln.');
    else if(tsb>=-10) lines.push('🏃 <b>Ausdauer Z2</b> (60–90 min) – bei gutem Gefühl kurze Z3-Reize einbauen.');
    else lines.push('🚶 <b>Moderate Ausdauer</b> (45–60 min Z1/Z2), bewusst ohne harte Antritte – TSB ist tief.');
  }else if(rec==="modify"){
    var parts=[];
    if(intensity==="reduce") parts.push('Intensität reduzieren – keine harten Intervalle');
    if(volume==="reduce") parts.push('Umfang kürzen (ca. 30–50 % weniger)');
    if(capZone) parts.push('Maximal Zone '+capZone);
    if(!parts.length) parts.push('Belastung moderat reduzieren');
    lines.push('🚴 <b>Leichte Einheit:</b> 45–60 min '+(capZone?('max. Z'+capZone):'Z1–Z2')+' im lockeren Tempo.');
    lines.push('⚠️ '+parts.join(' · ')+'.');
    if(sig.hrv&&sig.hrv.status==="amber") lines.push('❤️ HRV '+round1(sig.hrv.value)+' ms liegt '+round1(sig.hrv.delta_pct)+' % unter Baseline – Autonomes Nervensystem ist angespannt.');
    if(sig.rhr&&sig.rhr.status==="amber") lines.push('💓 Ruhepuls '+sig.rhr.value+' bpm ('+(sig.rhr.delta_bpm>0?'+':'')+sig.rhr.delta_bpm+' bpm über Baseline) – Erholungslage angespannt.');
  }else{
    lines.push('😴 <b>Ruhetag:</b> Kein Training. Spaziergang oder Dehnung in Z1 optional.');
    lines.push('🛌 Fokus: Schlaf (7–8 h), Flüssigkeit und Ernährung. Morgen neu bewerten.');
    if(acwr!==null&&acwr!==undefined&&acwr>=1.5) lines.push('🚨 ACWR '+round2(acwr)+' – Überlastungsgefahr hoch! Mehrere Ruhetage einplanen.');
  }

  // Sleep note
  if(sleepH!==null&&sleepH!==undefined&&sleepH<6.5&&rec!=="skip"){
    lines.push('😴 Schlaf '+round1(sleepH)+' h – Schlafdefizit. Einheit verkürzen oder besser verschieben.');
  }

  // ACWR note
  if(acwr!==null&&acwr!==undefined){
    if(acwr<0.8) lines.push('📉 ACWR '+round2(acwr)+' – leichte Unterbelastung. Falls bewusste Erholung: ok; sonst Belastung langsam steigern.');
    else if(acwr>=1.3&&rec!=="skip") lines.push('📈 ACWR '+round2(acwr)+' – hohe Belastung. Auf Überlastungszeichen achten.');
  }

  // Monotony
  if(dm.monotony!==null&&dm.monotony!==undefined&&dm.monotony>0.8){
    lines.push('🔁 Monotonie '+round2(dm.monotony)+' – wenig Abwechslung. Verschiedene Einheiten/Strecken einbauen.');
  }

  var hint='';
  if(ap.age) hint+='Mit '+ap.age+' Jahren Erholung besonders ernst nehmen. ';
  if(ap.sex&&ap.sex==='M') hint+='';
  recBox.innerHTML='<div class="rec '+cls+'"><h3>📋 Empfehlung für heute</h3>'+
    lines.map(function(l){return '<p>'+l+'</p>';}).join('')+
    (hint?'<p class="hint">💡 '+hint+'</p>':'')+'</div>';

  // ==== Tomorrow + Plan ====
  document.getElementById('tmrw').innerHTML='<div class="rec rec-'+(rec==='go'?'go':rec==='skip'?'skip':'modify')+'" style="border-left-width:4px">'+
    buildTomorrow(rec, rd, dm, cm, f)+'</div>';
  document.getElementById('plan').innerHTML=buildPlan(rec, rd, dm, cm, f, rpt.weekly_summary);

  // ==== Zonen (HF / Watt) ====
  var csZ=rpt.current_status||{};
  var zSports=(csZ.thresholds&&csZ.thresholds.sports)||{};
  var zSrc=zSports.cycling||zSports.run||null;
  var zInfo=zSrc&&zSrc.zones||null;
  var zList=zInfo&&zInfo.zones||[];
  if(zList.length){
    var zh=zList.slice(0,3).map(function(z){
      var hr='–';
      if(z.hr_max!==undefined&&z.hr_max!==null) hr=((z.hr_min===null||z.hr_min===undefined)?'<':z.hr_min+'–')+z.hr_max+' bpm';
      var pw='–';
      var w=z.power;
      if(w&&w.w_max!==undefined&&w.w_max!==null){
        if(w.pct_max>=900) pw='>'+Math.max(0,w.w_min-1)+' W';
        else if(w.w_min===null||w.w_min===undefined) pw='<'+w.w_max+' W';
        else pw=w.w_min+'–'+w.w_max+' W';
      }
      return '<div class="sig"><span class="name">'+z.zone+' · '+(z.name||'')+'</span>'+
        '<span class="delta">'+hr+'</span>'+
        '<span class="val">'+(pw!=='–'?'⚡ '+pw:'–')+'</span></div>';
    }).join('')+
    (zInfo.ftp_basis?'<div class="note" style="text-align:center;color:var(--muted);font-size:11px">Wattbasis: FTP '+zInfo.ftp_basis+' W</div>':'');
    document.getElementById('zones').innerHTML=zh;
  }else{
    document.getElementById('zones').innerHTML='<div class="err">Keine Zonendaten</div>';
  }

  // ==== VO2max Tipps ====
  var vo2Html=buildVo2(rd, dm, cm, f, ap, csZ.thresholds||null, zList);
  document.getElementById('vo2').innerHTML=vo2Html?vo2Html:'<div class="err">Kein VO2max-Wert vorhanden</div>';

  // ==== Signals ====
  var sigHtml="";
  // HRV
  if(sig.hrv){var h= sig.hrv;sigHtml+=sigRow("HRV (7d-Basis)",round1(h.value)+" ms",(h.delta_pct!==null&&h.delta_pct!==undefined)?(h.delta_pct>0?"+":"")+round1(h.delta_pct)+" %":null,h.status);}
  // RHR
  if(sig.rhr){var r=sig.rhr;sigHtml+=sigRow("Ruhepuls (7d-Basis)",r.value+" bpm",(r.delta_bpm!==null&&r.delta_bpm!==undefined)?((r.delta_bpm>0?"+":"")+r.delta_bpm+" bpm"):null,r.status);}
  // Sleep
  if(sig.sleep){var s=sig.sleep;sigHtml+=sigRow("Schlaf",round1(s.hours)+" h",(s.quality?"Qualität "+s.quality+"/4":null),s.status);}
  // ACWR
  if(sig.acwr){var a=sig.acwr;sigHtml+=sigRow("ACWR",round2(a.value),null,a.status);}
  // Recovery
  if(sig.ri){var ri=sig.ri;sigHtml+=sigRow("Recovery Index",round2(ri.value),(ri.value_yesterday?"gestern "+round2(ri.value_yesterday):null),ri.status);}
  // TSB
  if(sig.tsb){var t=sig.tsb;sigHtml+=sigRow("TSB",round1(t.value),(t.status==="green"?"frisch":null),t.status);}
  document.getElementById('signals').innerHTML=sigHtml||'<div class="note">Keine Signale vorhanden.</div>';

  // ==== Notes ====
  var notes=[];
  if(dm.strain!==null&&dm.strain!==undefined) notes.push("Belastung (Strain, 7d): "+round1(dm.strain));
  if(dm.stress_tolerance!==null&&dm.stress_tolerance!==undefined) notes.push("Stresstoleranz: "+dm.stress_tolerance);
  if(dm.load_recovery_ratio!==null&&dm.load_recovery_ratio!==undefined) notes.push("Load/Recovery-Verhältnis: "+round2(dm.load_recovery_ratio));
  if(dm.phase_detected) notes.push("Phase: "+dm.phase_detected);
  if(dm.consistency_index!==null&&dm.consistency_index!==undefined) notes.push("Konsistenz: "+round2(dm.consistency_index));
  if(dm.easy_time_ratio!==null&&dm.easy_time_ratio!==undefined) notes.push("Easy-Time-Anteil: "+round2(dm.easy_time_ratio)+" (Ziel ~0.80)");
  if(dm.grey_zone_percentage!==null&&dm.grey_zone_percentage!==undefined) notes.push("Grey Zone: "+round1(dm.grey_zone_percentage)+" % der Zeit");
  if(dm.seiler_tid_7d&&dm.seiler_tid_7d.classification) notes.push("Trainingsverteilung: "+dm.seiler_tid_7d.classification+" (Z1 "+round1(dm.seiler_tid_7d.z1_pct)+" % / Z2 "+round1(dm.seiler_tid_7d.z2_pct)+" % / Z3 "+round1(dm.seiler_tid_7d.z3_pct)+" %)");
  if(f.ctl!==undefined) notes.push("Fitness (CTL): "+f.ctl.toFixed(1));
  if(f.atl!==undefined) notes.push("Ermüdung (ATL): "+f.atl.toFixed(1));
  if(f.tsb!==undefined) notes.push("Form (TSB): "+f.tsb.toFixed(1));
  if(cm.spO2) notes.push("SpO2: "+cm.spO2+" %");
  if(cm.systolic&&cm.diastolic) notes.push("Blutdruck: "+cm.systolic+"/"+cm.diastolic+" mmHg");
  if(cm.respiration) notes.push("Atemfrequenz: "+cm.respiration+"/min");
  document.getElementById('notes').innerHTML=notes.length?
    notes.map(function(n){return '<div class="note">• '+n+'</div>';}).join(''):
    '<div class="note">Keine Notizen verfügbar.</div>';

  // ==== Alerts ====
  var alerts=rpt.alerts||[];
  var ah="";
  alerts.forEach(function(al){
    var ic=al.severity==="alarm"?"🔴":al.severity==="warning"?"🟡":"ℹ️";
    ah+='<div class="alert">'+ic+' <b>'+al.metric+'</b>: '+al.context+'</div>';
  });
  document.getElementById('alerts').innerHTML=ah||'<div class="note" style="color:var(--green)">✅ Keine aktiven Alerts.</div>';

  // Sync header
  var upd=(rpt.metadata||{}).last_updated||"";
  document.getElementById('sync').textContent="✅ "+new Date().toLocaleTimeString('de-DE')+" | v1.4"+(upd?" | Daten: "+upd.slice(0,16):"");
  localStorage.setItem('coach_cache',JSON.stringify(D));
  localStorage.setItem('coach_cache_time',String(Date.now()));
}

function load(){
  document.getElementById('sync').textContent="⏳ Lade latest.json...";
  var cached=localStorage.getItem('coach_cache');
  var cachedTime=parseInt(localStorage.getItem('coach_cache_time')||'0');
  if(cached&&Date.now()-cachedTime<300000){
    try{render(JSON.parse(cached));}catch(e){}
  }
  fetchData().then(render).catch(function(e){
    if(!cached){
      document.getElementById('sync').textContent="❌ "+e.message;
      document.getElementById('verdictCard').innerHTML='<div class="err">Daten konnten nicht geladen werden.<button class="reload" onclick="load()">Erneut versuchen</button></div>';
    }else{
      document.getElementById('sync').textContent="⚠️ Offline – Cache Daten";
    }
  });
}

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(function(r){r.update();}).catch(function(){});
}
load();
setInterval(load,600000);
</script>
</body>
</html>
